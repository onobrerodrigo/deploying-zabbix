services:
  mysql:
    image: mysql:5.7.42
    container_name: mysql-zabbix
    restart: unless-stopped
    command: --character-set-server=utf8 --collation-server=utf8_bin --explicit_defaults_for_timestamp=1
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  zabbix-server:
    image: zabbix/zabbix-server-mysql:6.0.43-ubuntu
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: ${DB_SERVER_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
      ZBX_CACHESIZE: ${ZBX_CACHESIZE}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "10051:10051"
    networks:
      - zabbix-net
    links:
      - mysql

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:6.0.43-ubuntu
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: ${DB_SERVER_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ZBX_SERVER_HOST: ${ZBX_SERVER_HOST}
      TZ: ${TZ}
      PHP_TZ: ${PHP_TZ}
    depends_on:
      zabbix-server:
        condition: service_started
    networks:
      - zabbix-net
    links:
      - mysql
      - zabbix-server

  nginx-proxy:
    image: nginx:stable
    container_name: nginx-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      zabbix-web:
        condition: service_started
    networks:
      - zabbix-net

volumes:
  mysql_data:

networks:
  zabbix-net: